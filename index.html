<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
:root {
  --bg0:#e8f0f8;--bg1:#f0f6ff;--bg2:#ffffff;
  --text-pri:#1a1916;--text-sec:#6b6860;--text-mut:#a09e9a;
  --border:#e2dfd9;--border-s:#c8c4bd;
  --acc-fill:#2563eb;--acc-on:#ffffff;--acc-bg:#eff6ff;--acc-text:#1d4ed8;--acc-bord:#bfdbfe;
  --warn-bg:#fffbeb;--warn-text:#92400e;--warn-bord:#fcd34d;
  --succ-bg:#f0fdf4;--succ-text:#166534;--succ-bord:#bbf7d0;
  --dang-fill:#dc2626;--dang-on:#ffffff;--dang-bg:#fef2f2;--dang-text:#991b1b;--dang-bord:#fecaca;
  --radius:8px;--shadow-md:0 4px 12px rgba(0,0,0,.12);
}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg0);color:var(--text-pri);font-size:16px;line-height:1.5;}

/* prevent iOS auto-zoom on input focus */
input,select,textarea{font-size:16px !important;}
/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;transition:background .2s,border-color .2s;}
.topbar-title{font-size:15px;font-weight:600;padding:0 14px;white-space:nowrap;color:var(--text-pri);border-right:1px solid var(--border);height:48px;display:flex;align-items:center;gap:6px;transition:color .2s,border-color .2s;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#6b6860;display:inline-block;flex-shrink:0;transition:background .3s;}
.sync-dot.online{background:#16a34a;}.sync-dot.error{background:#dc2626;}.sync-dot.syncing{background:#d97706;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tab-bar{flex:1;display:flex;height:48px;}
.tab-bar-btn{flex:1;height:100%;border:none;background:transparent;color:var(--text-sec);font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,background .15s,border-color .15s;}
.tab-bar-btn:hover{color:var(--text-pri);background:var(--bg1);}
.tab-bar-btn.active{color:var(--acc-fill);border-bottom-color:var(--acc-fill);font-weight:600;}
.tab-bar-btn+.tab-bar-btn{border-left:1px solid var(--border);}
/* dark topbar when sala (cameriere) is active */
.topbar.dark-nav{background:#222220;border-bottom-color:#38362f;}
.topbar.dark-nav .topbar-title{color:#f0ede8;border-right-color:#38362f;}

/* ════ MODALE CONFERMA ════ */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center;}
.modal-title{font-size:18px;font-weight:700;color:#1a1916;margin-bottom:10px;}
.modal-msg{font-size:15px;color:#6b6860;margin-bottom:24px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;}
.modal-btn-cancel{flex:1;padding:12px;border-radius:var(--radius);border:1px solid #c8c4bd;background:transparent;color:#6b6860;font-size:15px;font-weight:600;cursor:pointer;}
.modal-btn-cancel:hover{background:#f5f5f5;}
.modal-btn-confirm{flex:1;padding:12px;border-radius:var(--radius);border:none;background:#dc2626;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.modal-btn-confirm:hover{background:#b91c1c;}
#screen-cameriere{height:calc(100vh - 48px);flex-direction:column;overflow:hidden;background:#1a1916;}
.cam-tavolo-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.cam-tavolo-bar label{font-size:14px;font-weight:500;color:var(--text-sec);white-space:nowrap;}
.cam-tavolo-bar select{flex:1;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border-s);background:var(--bg1);color:var(--text-pri);font-size:15px;-webkit-appearance:none;appearance:none;}
.cam-level{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cam-level.hidden{display:none;}
/* griglia categorie */
.cat-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr auto;gap:12px;padding:12px 12px 90px;}
.cat-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;}
.cat-box:active{background:var(--acc-bg);transform:scale(.97);}
.cat-box-emoji{font-size:40px;line-height:1;}
.cat-box-name{font-size:18px;font-weight:700;color:var(--text-pri);}
.cat-box-count{position:absolute;top:12px;right:12px;background:var(--acc-fill);color:var(--acc-on);font-size:13px;font-weight:700;border-radius:12px;padding:2px 9px;display:none;}
.cat-box-count.visible{display:block;}
/* box piatto personalizzato — occupa entrambe le colonne */
.cat-box-custom{grid-column:1/-1;min-height:80px;background:#1a1916;border-color:#1a1916;flex-direction:row;gap:16px;justify-content:center;padding:0 24px;}
.cat-box-custom:active{background:#2c2c29;}
.cat-box-custom .cat-box-emoji{font-size:30px;}
.cat-box-custom .cat-box-name{color:#f0ede8;font-size:20px;}
/* livello 3 — piatto personalizzato */
#cam-level-3{display:flex;flex-direction:column;overflow:hidden;}
#cam-level-3.hidden{display:none;}
.custom-cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:16px 14px;}
.custom-cat-btn{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;}
.custom-cat-btn:active{transform:scale(.97);}
.custom-cat-btn-emoji{font-size:32px;}
.custom-cat-btn-name{font-size:16px;font-weight:700;color:var(--text-pri);}
.custom-form{padding:16px 14px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px;}
.custom-form-label{font-size:14px;font-weight:600;color:#9e9b96;}
.custom-form-input{width:100%;padding:14px 14px;border-radius:var(--radius);border:1px solid #4a4842;background:#2c2c29;color:#f0ede8;font-size:18px;font-family:inherit;resize:none;}
.custom-form-input::placeholder{color:#6b6860;}
.custom-form-input:focus{outline:none;border-color:#3b82f6;}
.custom-add-btn{padding:14px;border-radius:var(--radius);border:none;background:var(--acc-fill);color:#fff;font-size:17px;font-weight:700;cursor:pointer;}
.custom-add-btn:disabled{opacity:.4;cursor:default;}
/* livello 2 */
#cam-level-2{display:flex;flex-direction:column;overflow:hidden;}
#cam-level-2.hidden{display:none;}
.cam-piatti-header{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.back-btn{width:40px;height:40px;border-radius:var(--radius);border:1px solid var(--border-s);background:transparent;color:var(--text-pri);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cam-piatti-title{font-size:20px;font-weight:700;flex:1;}
.cam-piatti-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}
.cam-piatto-row{display:flex;align-items:center;padding:18px 16px;border-bottom:1px solid var(--border);background:var(--bg2);gap:14px;min-height:76px;}
.cam-piatto-info{flex:1;min-width:0;}
.cam-piatto-name{font-size:18px;font-weight:600;}
.cam-piatto-price{font-size:16px;color:var(--acc-text);font-weight:600;margin-top:4px;}
.inline-qty{display:flex;align-items:center;border:1.5px solid var(--border-s);border-radius:28px;overflow:hidden;background:var(--bg1);}
.iq-btn{width:44px;height:44px;border:none;background:transparent;color:var(--text-pri);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;flex-shrink:0;}
.iq-btn:active{background:var(--border-s);}
.iq-val{min-width:34px;text-align:center;font-size:17px;font-weight:700;color:var(--text-pri);}
.iq-val.zero{color:var(--text-mut);}
/* FAB */
.cart-fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;background:var(--acc-fill);color:var(--acc-on);border:none;border-radius:32px;padding:16px 40px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-md);transition:transform .15s,opacity .2s;white-space:nowrap;}
.cart-fab:active{transform:translateX(-50%) scale(.97);}
.cart-fab .cart-count{background:rgba(255,255,255,.28);border-radius:14px;padding:2px 10px;font-size:16px;font-weight:700;}
.cart-fab.cart-count-zero .cart-count{display:none;}
.cart-fab.hidden{opacity:0;pointer-events:none;}
/* cart overlay */
.cart-overlay{display:none;position:fixed;inset:0;z-index:300;flex-direction:column;background:var(--bg0);}
.cart-overlay.open{display:flex;}
.cart-header{display:flex;align-items:center;padding:14px;background:var(--bg2);border-bottom:1px solid var(--border);gap:10px;}
.cart-header h2{font-size:18px;font-weight:600;flex:1;}
.cart-close{width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--border-s);background:transparent;color:var(--text-pri);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cart-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.cart-empty{text-align:center;padding:40px 20px;color:var(--text-mut);font-size:15px;}
.cart-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.cart-item-name{flex:1;font-size:16px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border-s);background:var(--bg1);color:var(--text-pri);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:active{background:var(--border-s);}
.qty-val-c{font-size:16px;font-weight:600;min-width:20px;text-align:center;}
.cart-item-price{font-size:14px;color:var(--text-sec);min-width:52px;text-align:right;}
.cart-footer{padding:14px;background:var(--bg2);border-top:1px solid var(--border);}
.cart-total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;margin-bottom:10px;}
.cart-note{width:100%;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border-s);background:var(--bg1);color:var(--text-pri);font-size:15px;margin-bottom:10px;resize:none;font-family:inherit;}
.send-btn{width:100%;padding:15px;border-radius:var(--radius);border:none;background:var(--acc-fill);color:var(--acc-on);font-size:17px;font-weight:700;cursor:pointer;}
.send-btn:disabled{opacity:.35;cursor:default;}

/* ════ CUCINA ════ */
#screen-cucina{min-height:calc(100vh - 48px);}
.cucina-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.cucina-stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat-pill{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid;}
.stat-prep  {background:var(--acc-bg); color:var(--acc-text); border-color:var(--acc-bord);}
.stat-pronto{background:var(--succ-bg);color:var(--succ-text);border-color:var(--succ-bord);}
.last-update{font-size:12px;color:var(--text-mut);}
/* 2 colonne */
.cucina-kanban{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:auto;gap:9px;padding:9px;overflow-y:auto;align-content:start;}
@media(max-width:1100px){.cucina-kanban{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.cucina-kanban{grid-template-columns:1fr;}}
.comanda-card{background:var(--bg2);border:2px solid #1a1916;border-radius:9px;overflow:hidden;}
.comanda-head{display:flex;align-items:center;gap:5px;padding:7px 11px;border-bottom:2px solid #1a1916;background:var(--bg1);}
.comanda-tavolo{font-size:23px;font-weight:700;flex:1;}
.comanda-time{font-size:15px;color:var(--text-mut);}
.new-badge{background:var(--dang-fill);color:var(--dang-on);font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.04em;}
.comanda-del-btn{width:22px;height:22px;border:1px solid var(--dang-bord);border-radius:var(--radius);background:transparent;color:var(--dang-text);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.comanda-del-btn:hover{background:var(--dang-bg);}
.cat-section-header{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px 2px;border-bottom:1px solid rgba(0,0,0,.08);}
.cat-color-0{background:#fff0e0;color:#c45000;}
.cat-color-1{background:#e6f4ea;color:#2e7d32;}
.cat-color-2{background:#e3edf9;color:#1565c0;}
.cat-color-3{background:#fce4ec;color:#ad1457;}
.cat-color-4{background:#ede7f6;color:#6a1b9a;}
.cat-color-5{background:#ede7f6;color:#6a1b9a;}
.cat-color-other{background:#f5f5f5;color:#333;}
.cat-group{display:flex;}
.cat-group+.cat-group{border-top:3px solid rgba(0,0,0,.45);}
.cat-bar{width:28px;min-width:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;letter-spacing:.05em;writing-mode:vertical-lr;text-orientation:upright;border-radius:0;}
.cat-bar-0{background:#fff0e0;color:#c45000;}
.cat-bar-1{background:#e6f4ea;color:#2e7d32;}
.cat-bar-2{background:#e3edf9;color:#1565c0;}
.cat-bar-other{background:#f5f5f5;color:#555;}
.cat-righe{flex:1;}
.piatto-riga{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--border);}
.piatto-riga:last-of-type{border-bottom:none;}
.piatto-riga-info{flex:1;display:flex;gap:7px;align-items:baseline;}
.piatto-riga-qty{font-weight:800;font-size:22px;min-width:27px;color:var(--text-pri);}
.piatto-riga-name{font-size:20px;font-weight:600;color:var(--text-pri);}
.piatto-riga-name.done{text-decoration:line-through;color:var(--text-mut);font-weight:400;}
.piatto-pronto-btn{padding:3px 7px;border-radius:var(--radius);border:1px solid var(--succ-bord);background:transparent;color:var(--succ-text);font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;}
.piatto-pronto-btn:hover{background:var(--succ-bg);}
.comanda-note{font-size:15px;color:#1a1916;font-weight:700;padding:8px 14px;border-top:2px solid #1a1916;background:var(--bg1);}
.comanda-note-label{color:#dc2626;font-weight:700;}
.kanban-empty{padding:22px;text-align:center;color:var(--text-mut);font-size:12px;}

/* ════ TAVOLI ════ */
#screen-tavoli{min-height:calc(100vh - 48px);}
.tavoli-wrap{flex:1;overflow-y:auto;padding:14px;}
.tavoli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.tavolo-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.tavolo-card-header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--acc-bg);border-bottom:1px solid var(--acc-bord);}
.tavolo-card-num{font-size:17px;font-weight:700;color:var(--acc-text);flex:1;}
.tavolo-card-total{font-size:15px;font-weight:700;color:var(--acc-text);}
.tavolo-card-actions{display:flex;gap:8px;margin-top:12px;}
.tavolo-print-btn{flex:1;padding:9px 12px;border:1px solid var(--acc-bord);border-radius:var(--radius);background:var(--acc-bg);color:var(--acc-text);font-size:14px;font-weight:600;cursor:pointer;text-align:center;}
.tavolo-print-btn:hover{background:#dbeafe;}
.tavolo-del-btn{flex:1;padding:9px 12px;border:1px solid var(--dang-bord);border-radius:var(--radius);background:transparent;color:var(--dang-text);font-size:14px;font-weight:600;cursor:pointer;text-align:center;}
.tavolo-del-btn:hover{background:var(--dang-bg);}
.tavolo-card-body{padding:10px 14px;}
.tavolo-piatto-line{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:15px;}
.tavolo-piatto-line:last-child{border-bottom:none;}
.tavolo-piatto-name{flex:1;color:var(--text-pri);font-weight:500;}
.tavolo-piatto-qty{font-weight:700;color:var(--text-sec);margin:0 8px;}
.tavolo-piatto-price{color:var(--text-sec);min-width:52px;text-align:right;}
.tavolo-empty{text-align:center;padding:40px 20px;color:var(--text-mut);font-size:14px;}

/* ════ MENU MANAGER ════ */
#screen-menu{min-height:calc(100vh - 48px);}
.menu-manager-wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px;width:100%;}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-sec);margin-bottom:10px;margin-top:20px;}
.section-label:first-child{margin-top:0;}
.add-dish-form{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.form-row{display:flex;gap:8px;flex-wrap:wrap;}
.form-input{flex:2;min-width:120px;padding:9px 11px;border-radius:var(--radius);border:1px solid var(--border-s);background:var(--bg1);color:var(--text-pri);font-size:15px;font-family:inherit;}
.form-input:focus{outline:none;border-color:var(--acc-fill);box-shadow:0 0 0 2px var(--acc-bg);}
.form-input-sm{flex:1;min-width:90px;}
.form-select{flex:1.5;min-width:130px;padding:9px 11px;border-radius:var(--radius);border:1px solid var(--border-s);background:var(--bg1);color:var(--text-pri);font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none;}
.form-select:focus{outline:none;border-color:var(--acc-fill);}
.err-msg{font-size:13px;color:var(--dang-text);}
.add-dish-btn{width:100%;padding:11px;border-radius:var(--radius);border:none;background:var(--acc-fill);color:var(--acc-on);font-size:15px;font-weight:600;cursor:pointer;}
.add-dish-btn:hover:not(:disabled){opacity:.88;}
.add-dish-btn:disabled{opacity:.4;cursor:default;}
.dish-list-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.dish-list-item:last-of-type{border-bottom:none;}
.dish-order-btns{display:flex;flex-direction:column;gap:2px;}
.dish-ord-btn{width:22px;height:20px;border:1px solid var(--border-s);border-radius:4px;background:var(--bg1);color:var(--text-sec);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dish-ord-btn:hover{background:var(--border-s);}
.dish-info{flex:1;min-width:0;}
.dish-name{font-size:15px;font-weight:500;}
.dish-meta{font-size:13px;color:var(--text-sec);}
.dish-delete{width:32px;height:32px;border:1px solid var(--dang-bord);border-radius:var(--radius);background:transparent;color:var(--dang-text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dish-delete:hover{background:var(--dang-bg);}
.dish-edit-btn{width:32px;height:32px;border:1px solid var(--acc-bord);border-radius:var(--radius);background:transparent;color:var(--acc-text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.dish-edit-btn:hover{background:var(--acc-bg);}
.dish-edit-form{display:none;padding:10px 14px 12px;background:var(--bg1);border-top:1px solid var(--border);gap:8px;flex-direction:column;}
.dish-edit-form.open{display:flex;}
.dish-edit-row{display:flex;gap:8px;flex-wrap:wrap;}

<script>
const SUPA_URL='https://sptwxscoqzbazpojgikv.supabase.co';
const SUPA_KEY='sb_publishable_Kmndi3DKhim7hNM1V8maEQ_b17Hl2YA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let menu=[], order={}, comande=[], cucinaSeenIds=new Set();
const NUM_TAVOLI=20;
const CAT_CONFIG=[
  {name:'Antipasti',emoji:'🥗'},{name:'Primi',emoji:'🍝'},

function getTavolo(){

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity=0;},2400);}
function setSyncState(s){document.getElementById('sync-dot').className='sync-dot '+s;}

function showTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('visible'));

async function loadMenu(){
  setSyncState('syncing');

async function saveMenuOrder(){await sb.from('menu').upsert(menu.map((d,i)=>({...d,sort_order:i})));}

/* ── CAMERIERE ── */
function renderCatGrid(){
  document.getElementById('cat-grid').innerHTML=CAT_CONFIG.map(cfg=>{
    const count=menu.filter(p=>p.cat===cfg.name).reduce((s,p)=>s+(order[p.id]||0),0);
    return`<div class="cat-box" onclick="openCategory('${esc(cfg.name)}')">
      <span class="cat-box-emoji">${cfg.emoji}</span>
      <span class="cat-box-name">${cfg.name}</span>
      <span class="cat-box-count ${count>0?'visible':''}" id="cbox-count-${esc(cfg.name)}">${count}</span>
    </div>`;
  }).join('')+
  `<div class="cat-box cat-box-custom" onclick="openCustomPiatto()">
    <span class="cat-box-emoji">✏️</span>
    <span class="cat-box-name">Piatto personalizzato</span>
  </div>`;
}
function refreshCatCounts(){
  CAT_CONFIG.forEach(cfg=>{
    const el=document.getElementById('cbox-count-'+cfg.name);if(!el)return;
    const c=menu.filter(p=>p.cat===cfg.name).reduce((s,p)=>s+(order[p.id]||0),0);
    el.textContent=c;el.classList.toggle('visible',c>0);
  });
}
function openCategory(cat){
  document.getElementById('cam-level-1').classList.add('hidden');
  document.getElementById('cam-level-2').classList.remove('hidden');
  document.getElementById('cam-piatti-title').textContent=cat;
  renderPiattiList(cat);
}
function goBackToCategories(){
  document.getElementById('cam-level-2').classList.add('hidden');
  document.getElementById('cam-level-3').classList.add('hidden');
  document.getElementById('cam-level-1').classList.remove('hidden');
  refreshCatCounts();
}

function openCustomPiatto(){
  document.getElementById('cam-level-1').classList.add('hidden');
  document.getElementById('cam-level-3').classList.remove('hidden');
  document.getElementById('custom-step-cat').style.display='block';
  document.getElementById('custom-step-form').style.display='none';
}

function openCustomForm(cat){
  document.getElementById('custom-form-cat-label').textContent=cat;
  document.getElementById('custom-piatto-text').value='';
  document.getElementById('custom-add-btn').disabled=true;
  document.getElementById('custom-step-cat').style.display='none';
  document.getElementById('custom-step-form').style.display='flex';
  setTimeout(()=>document.getElementById('custom-piatto-text').focus(),100);
}

function backToCustomCat(){
  document.getElementById('custom-step-form').style.display='none';
  document.getElementById('custom-step-cat').style.display='block';
}

document.addEventListener('input',e=>{
  if(e.target.id==='custom-piatto-text'){
    document.getElementById('custom-add-btn').disabled=e.target.value.trim().length===0;
  }
});

function addCustomPiatto(){
  const cat=document.getElementById('custom-form-cat-label').textContent;
  const name=document.getElementById('custom-piatto-text').value.trim();
  if(!name) return;
  const customId='custom_'+Date.now();
  // aggiunge al carrello come piatto speciale
  order[customId]=1;
  // salva i dati del piatto custom temporaneamente in un map
  if(!window._customPiatti) window._customPiatti={};
  window._customPiatti[customId]={id:customId,name,cat,price:0,custom:true};
  goBackToCategories();
  updateFab();
  renderCart();
  showToast('✓ Piatto personalizzato aggiunto');
}
function renderPiattiList(cat){
  const piatti=menu.filter(p=>p.cat===cat);
  const el=document.getElementById('cam-piatti-list');
  if(!piatti.length){el.innerHTML='<div style="padding:24px;text-align:center;color:var(--text-mut)">Nessun piatto</div>';return;}
  el.innerHTML=piatti.map(p=>{
    const qty=order[p.id]||0;
    return`<div class="cam-piatto-row">
      <div class="cam-piatto-info">
        <div class="cam-piatto-name">${esc(p.name)}</div>
        <div class="cam-piatto-price">€${Number(p.price).toFixed(2)}</div>
      </div>
      <div class="inline-qty">
        <button class="iq-btn" onclick="changeQty('${p.id}',-1)">−</button>
        <span class="iq-val ${qty===0?'zero':''}" id="iq-${p.id}">${qty}</span>
        <button class="iq-btn" onclick="changeQty('${p.id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
}
function changeQty(id,delta){
  order[id]=(order[id]||0)+delta;
  if(order[id]<=0)delete order[id];
  const el=document.getElementById('iq-'+id);
  if(el){const q=order[id]||0;el.textContent=q;el.className='iq-val'+(q===0?' zero':'');}
  updateFab();renderCart();
}
function updateFab(){
  const total=Object.values(order).reduce((a,b)=>a+b,0);
  const fab=document.getElementById('cart-fab');
  const tv=getTavolo();
  if(tv){fab.classList.remove('hidden');document.getElementById('cart-count').textContent=total;fab.classList.toggle('cart-count-zero',total===0);}
  else fab.classList.add('hidden');
  document.getElementById('send-btn').disabled=total===0||!tv;
}
function openCart(){renderCart();document.getElementById('cart-overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeCart(){document.getElementById('cart-overlay').classList.remove('open');document.body.style.overflow='';}
function renderCart(){
  const el=document.getElementById('cart-body');
  const ids=Object.keys(order);
  if(!ids.length){el.innerHTML='<div class="cart-empty">Nessun piatto aggiunto</div>';setTotal();return;}
  el.innerHTML=ids.map(id=>{
    const p=menu.find(x=>x.id===id)||(window._customPiatti&&window._customPiatti[id]);
    if(!p) return'';
    const price=p.custom?'??':`€${(Number(p.price)*order[id]).toFixed(2)}`;
    return`<div class="cart-item">
      <div class="cart-item-name">${esc(p.name)}${p.custom?` <span style="font-size:11px;color:#9e9b96">(${esc(p.cat)})</span>`:''}</div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="cartCQ('${id}',-1)">−</button>
        <span class="qty-val-c">${order[id]}</span>
        <button class="qty-btn" onclick="cartCQ('${id}',1)">+</button>
      </div>
      <div class="cart-item-price">${price}</div>
    </div>`;
  }).join('');
  setTotal();
}
function cartCQ(id,delta){
  order[id]=(order[id]||0)+delta;if(order[id]<=0)delete order[id];
  updateFab();renderCart();
  const el=document.getElementById('iq-'+id);
  if(el){const q=order[id]||0;el.textContent=q;el.className='iq-val'+(q===0?' zero':'');}
}
function setTotal(){
  let tot=0;let hasCustom=false;
  for(const id in order){
    if(window._customPiatti&&window._customPiatti[id]){hasCustom=true;continue;}
    const p=menu.find(x=>x.id===id);if(p)tot+=Number(p.price)*order[id];
  }
  document.getElementById('cart-total').textContent=hasCustom?'€'+tot.toFixed(2)+' + ??':'€'+tot.toFixed(2);
}
async function sendComanda(){
  const tv=getTavolo();
  if(!tv||!Object.keys(order).length)return;
  const note=document.getElementById('order-note').value.trim();
  const piatti=Object.entries(order).map(([id,qty])=>{
    if(window._customPiatti&&window._customPiatti[id]){
      const cp=window._customPiatti[id];
      return{name:cp.name,qty,price:0,cat:cp.cat,custom:true,priceLabel:'??'};
    }
    const p=menu.find(x=>x.id===id);
    return{name:p?p.name:id,qty,price:p?Number(p.price):0,cat:p?p.cat:''};
  });
  const c={id:'c'+Date.now(),tavolo:tv,piatti,note,stato:'attivo',ts:Date.now()};
  setSyncState('syncing');
  const{error}=await sb.from('comande').insert(c);
  if(error){setSyncState('error');showToast('❌ Errore invio comanda');return;}
  setSyncState('online');
  order={};
  if(window._customPiatti) window._customPiatti={};
  document.getElementById('order-note').value='';
  document.getElementById('sel-tavolo').value='';
  document.getElementById('custom-tavolo-input').value='';
  clearCustomTavolo();
  closeCart();updateFab();renderCart();renderCatGrid();
  // torna alla schermata iniziale (griglia categorie)
  document.getElementById('cam-level-1').classList.remove('hidden');
  document.getElementById('cam-level-2').classList.add('hidden');
  showToast('✅ Comanda tavolo '+tv+' inviata!');
}

/* ── CUCINA ── */
async function loadCucina(){
  const{data,error}=await sb.from('comande').select('*').eq('stato','attivo').order('ts');
  if(error){setSyncState('error');return;}
  comande=data||[];setSyncState('online');renderCucina();
}

function parsePiatti(c){return Array.isArray(c.piatti)?c.piatti:JSON.parse(c.piatti||'[]');}

function renderCucina(){
  const countEl=document.getElementById('cucina-tab-count');
  if(countEl){countEl.textContent=comande.length;countEl.style.display=comande.length?'inline':'none';}

  const el=document.getElementById('cucina-grid');
  if(!comande.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-mut);font-size:15px">Nessuna comanda</div>';return;}

  el.innerHTML=comande.map(c=>{
    const isNew=!cucinaSeenIds.has(c.id);if(isNew)cucinaSeenIds.add(c.id);
    const time=new Date(c.ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const piatti=parsePiatti(c);

    const SOLO_TAVOLI=['Dessert','Bevande','Bar'];
    const catOrder=CAT_CONFIG.map(x=>x.name);
    const byCat={};
    piatti.forEach(p=>{
      const k=p.cat||'Altro';
      if(SOLO_TAVOLI.includes(k)) return;
      if(!byCat[k]) byCat[k]=[];
      byCat[k].push(p);
    });
    const cats=[...catOrder.filter(c=>byCat[c]),...Object.keys(byCat).filter(c=>!catOrder.includes(c))];
    if(!cats.length) return '';

    const CAT_LETTER={'Antipasti':'A','Primi':'P','Secondi':'S'};
    const catHtml=cats.map(cat=>{
      const idx=catOrder.indexOf(cat);
      const barCls=idx>=0?'cat-bar-'+idx:'cat-bar-other';
      const letter=CAT_LETTER[cat]||cat.charAt(0).toUpperCase();
      const righe=byCat[cat].map(p=>`<div class="piatto-riga">
          <div class="piatto-riga-info">
            <span class="piatto-riga-qty">${p.qty}×</span>
            <span class="piatto-riga-name">${esc(p.name)}</span>
          </div>
        </div>`).join('');
      return`<div class="cat-group"><div class="cat-bar ${barCls}">${letter}</div><div class="cat-righe">${righe}</div></div>`;
    }).join('');

    return`<div class="comanda-card">
      <div class="comanda-head">
        <span class="comanda-tavolo">Tavolo ${c.tavolo}</span>
        ${isNew?'<span class="new-badge">NUOVO</span>':''}
        <span class="comanda-time">${time}</span>
        <button class="comanda-del-btn" onclick="cancellaComanda('${c.id}')" title="Cancella">✕</button>
      </div>
      ${catHtml}
      ${c.note?`<div class="comanda-note"><span class="comanda-note-label">Note</span> ${esc(c.note)}</div>`:''}
    </div>`;
  }).join('');
}

function chiudiModale(){document.getElementById('modal-cancella').classList.remove('open');}

async function cancellaComanda(id){
  const modal=document.getElementById('modal-cancella');
  modal.classList.add('open');
  const oldBtn=document.getElementById('modal-confirm-btn');
  const newBtn=oldBtn.cloneNode(true);
  oldBtn.replaceWith(newBtn);
  newBtn.addEventListener('click',async()=>{
    chiudiModale();
    setSyncState('syncing');
    const{error}=await sb.from('comande').delete().eq('id',id);
    if(error){setSyncState('error');showToast('❌ Errore cancellazione');return;}
    setSyncState('online');showToast('Comanda cancellata');
    await loadCucina();
    if(document.getElementById('screen-tavoli').classList.contains('visible')) await loadTavoli();
  });
}

/* ── TAVOLI ── */
async function loadTavoli(){
  const{data,error}=await sb.from('comande').select('*').eq('stato','attivo').order('ts');
  if(error){setSyncState('error');return;}
  setSyncState('online');renderTavoli(data||[]);
}
function renderTavoli(comandeAttive){
  const el=document.getElementById('tavoli-grid');
  if(!comandeAttive.length){el.innerHTML='<div class="tavolo-empty">Nessun tavolo attivo al momento</div>';return;}
  const byTavolo={};
  comandeAttive.forEach(c=>{
    const tv=c.tavolo;
    if(!byTavolo[tv]) byTavolo[tv]={tavolo:tv,piatti:{},note:[],ids:[]};
    byTavolo[tv].ids.push(c.id);
    parsePiatti(c).forEach(p=>{
      if(!byTavolo[tv].piatti[p.name]) byTavolo[tv].piatti[p.name]={name:p.name,qty:0,price:p.price};
      byTavolo[tv].piatti[p.name].qty+=p.qty;
    });
    if(c.note) byTavolo[tv].note.push(c.note);
  });

  // salva i dati in memoria per stampa e cancellazione
  window._tavoliData={};
  const sorted=Object.values(byTavolo).sort((a,b)=>Number(a.tavolo)-Number(b.tavolo));
  sorted.forEach(tv=>{ window._tavoliData[tv.tavolo]=tv; });

  el.innerHTML=sorted.map(tv=>{
    const righe=Object.values(tv.piatti);
    const totale=righe.reduce((s,p)=>s+Number(p.price)*p.qty,0);
    const hasCustom=righe.some(p=>Number(p.price)===0);
    const totaleStr=hasCustom?`€${totale.toFixed(2)} + ??`:`€${totale.toFixed(2)}`;
    const tvKey=esc(tv.tavolo);
    return`<div class="tavolo-card">
      <div class="tavolo-card-header">
        <span class="tavolo-card-num">Tavolo ${tv.tavolo}</span>
        <span class="tavolo-card-total">${totaleStr}</span>
      </div>
      <div class="tavolo-card-body">
        ${righe.map(p=>`<div class="tavolo-piatto-line">
          <span class="tavolo-piatto-name">${esc(p.name)}</span>
          <span class="tavolo-piatto-qty">${p.qty}×</span>
          <span class="tavolo-piatto-price">${Number(p.price)===0?'??':'€'+(Number(p.price)*p.qty).toFixed(2)}</span>
        </div>`).join('')}
        ${tv.note.length?`<div style="font-size:13px;color:var(--text-sec);margin-top:8px">Note: ${tv.note.map(n=>esc(n)).join(' — ')}</div>`:''}
        <div class="tavolo-card-actions">
          <button class="tavolo-del-btn" onclick="cancellaTavolo('${tvKey}')" title="Cancella tavolo">✕ Cancella</button>
          <button class="tavolo-print-btn" onclick="stampaConto('${tvKey}')" title="Stampa conto">🖨 Stampa conto</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function stampaConto(tavolo){
  const tv=window._tavoliData&&window._tavoliData[tavolo];
  if(!tv) return;
  const righe=Object.values(tv.piatti);
  const note=tv.note;
  const ora=new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const totale=righe.reduce((s,p)=>s+Number(p.price)*p.qty,0);
  const hasCustom=righe.some(p=>Number(p.price)===0);

  const righeHtml=righe.map(p=>`
    <tr>
      <td>${p.qty}×</td>
      <td>${p.name}</td>
      <td style="text-align:right">${Number(p.price)===0?'??':'€'+(Number(p.price)*p.qty).toFixed(2)}</td>
    </tr>`).join('');

  const html=`<!DOCTYPE html>

async function cancellaTavolo(tavolo){
  const tv=window._tavoliData&&window._tavoliData[tavolo];
  if(!tv) return;
  const ids=tv.ids;
  if(!confirm('Cancellare tutte le comande di questo tavolo?')) return;
  setSyncState('syncing');
  const{error}=await sb.from('comande').delete().in('id',ids);
  if(error){setSyncState('error');showToast('❌ Errore cancellazione');return;}
  setSyncState('online');
  showToast('Tavolo cancellato');
  await loadTavoli();
  if(document.getElementById('screen-cucina').classList.contains('visible')) await loadCucina();
}

/* ── REALTIME + AUTO-REFRESH 5s ── */
function subscribeRealtime(){
  sb.channel('all-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'comande'},async()=>{
      await loadCucina();
      if(document.getElementById('screen-tavoli').classList.contains('visible')) await loadTavoli();
    })
    .subscribe(s=>{
      if(s==='SUBSCRIBED')setSyncState('online');
      else if(s==='CLOSED'||s==='CHANNEL_ERROR')setSyncState('error');
    });

  // polling ogni 5 secondi come fallback
  setInterval(async()=>{
    if(document.getElementById('screen-cucina').classList.contains('visible')) await loadCucina();
    if(document.getElementById('screen-tavoli').classList.contains('visible')) await loadTavoli();
  }, 5000);
}

/* ── MENU MANAGER ── */
function renderCatSelect(){
  const sel=document.getElementById('dish-cat-sel');
  sel.innerHTML=`<option value="">— Categoria —</option>`+CAT_CONFIG.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  checkAddDishBtn();
}
function checkAddDishBtn(){
  const name=document.getElementById('dish-name').value.trim();
  const price=document.getElementById('dish-price').value.trim();
  const cat=document.getElementById('dish-cat-sel').value;
  const btn=document.getElementById('add-dish-btn');
  if(btn) btn.disabled=!(name&&price&&cat);
}
function renderDishList(){
  const el=document.getElementById('dish-list');
  if(!menu.length){el.innerHTML='<div class="no-dishes">Nessun piatto. Aggiungine uno sopra!</div>';return;}
  const catNames=CAT_CONFIG.map(c=>c.name);
  const byCat={};
  catNames.forEach(c=>byCat[c]=[]);
  menu.forEach(d=>{
    const k=d.cat&&byCat[d.cat]!==undefined?d.cat:catNames[0];
    byCat[k].push(d);
  });
  el.innerHTML=catNames.map(cat=>{
    const items=byCat[cat];
    if(!items.length) return '';
    const rows=items.map(d=>`
      <div class="dish-list-item" id="dish-item-${d.id}">
        <div class="dish-info">
          <div class="dish-name">${esc(d.name)}</div>
          <div class="dish-meta">€${Number(d.price).toFixed(2)}</div>
        </div>
        <button class="dish-edit-btn" onclick="toggleEditDish('${d.id}')" title="Modifica">✏️</button>
        <button class="dish-delete" onclick="deleteDish('${d.id}')">🗑</button>
      </div>
      <div class="dish-edit-form" id="dish-edit-${d.id}">
        <div class="dish-edit-row">
          <input class="form-input" id="edit-name-${d.id}" value="${esc(d.name)}" placeholder="Nome" />
          <input class="form-input form-input-sm" id="edit-price-${d.id}" type="number" min="0" step="0.5" value="${Number(d.price).toFixed(2)}" placeholder="€" />
        </div>
        <div class="dish-edit-row">
          <select class="form-select" id="edit-cat-${d.id}">${CAT_CONFIG.map(c=>`<option value="${esc(c.name)}"${c.name===d.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
        </div>
        <button class="add-dish-btn" style="margin-top:4px" onclick="saveDish('${d.id}')">Salva modifiche</button>
      </div>`).join('');
    return`<div class="dish-cat-section">
      <div class="dish-cat-label">${esc(cat)}</div>
      <div class="dish-cat-items">${rows}</div>
    </div>`;
  }).join('');
}
function toggleEditDish(id){
  const form=document.getElementById('dish-edit-'+id);
  form.classList.toggle('open');
}
async function saveDish(id){
  const name=document.getElementById('edit-name-'+id).value.trim();
  const price=parseFloat(document.getElementById('edit-price-'+id).value);
  const cat=document.getElementById('edit-cat-'+id).value;
  if(!name||isNaN(price)||price<0){showToast('❌ Dati non validi');return;}
  setSyncState('syncing');
  const{error}=await sb.from('menu').update({name,price,cat}).eq('id',id);
  if(error){setSyncState('error');showToast('❌ Errore salvataggio');return;}
  setSyncState('online');await loadMenu();showToast('Piatto aggiornato!');
}
async function addDish(){
  const name=document.getElementById('dish-name').value.trim();
  const price=parseFloat(document.getElementById('dish-price').value);
  const cat=document.getElementById('dish-cat-sel').value;
  const errEl=document.getElementById('add-dish-err');errEl.textContent='';
  if(!name){errEl.textContent='Inserisci il nome del piatto.';return;}
  if(isNaN(price)||price<0){errEl.textContent='Inserisci un prezzo valido.';return;}
  if(!cat){errEl.textContent='Seleziona una categoria.';return;}
  setSyncState('syncing');
  const{error}=await sb.from('menu').insert({id:'p'+Date.now(),cat,name,price,sort_order:menu.length});
  if(error){setSyncState('error');showToast('❌ Errore salvataggio');return;}
  setSyncState('online');
  document.getElementById('dish-name').value='';
  document.getElementById('dish-price').value='';
  document.getElementById('dish-cat-sel').value='';
  checkAddDishBtn();
  await loadMenu();showToast('Piatto aggiunto!');
}
async function deleteDish(id){
  setSyncState('syncing');
  await sb.from('menu').delete().eq('id',id);
  setSyncState('online');await loadMenu();
}
async function moveDish(i,dir){
  const j=i+dir;if(j<0||j>=menu.length)return;
  [menu[i],menu[j]]=[menu[j],menu[i]];
  renderDishList();await saveMenuOrder();await loadMenu();
}

init();
</script>
