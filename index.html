<!-- ══════════════ PIN SCREEN ══════════════ -->
<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-title">Accesso</div>
    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key pin-key-empty"></button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key pin-key-del" onclick="pinDel()">⌫</button>
    </div>
  </div>
</div>



<nav class="topbar">
  <div class="topbar-title"><span id="topbar-logo-fallback" style="display:none">GDA</span> <span class="sync-dot" id="sync-dot"></span></div>
  <div class="tab-bar">
    <button class="tab-bar-btn active" id="tab-sala"  onclick="showTab('cameriere')">Sala</button>
    <button class="tab-bar-btn"        id="tab-cuci"  onclick="showTab('cucina')">Cucina <span id="cucina-tab-count" style="background:rgba(0,0,0,.12);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:2px;display:none">0</span></button>
    <button class="tab-bar-btn"        id="tab-dolci" onclick="showTab('dolci')">Dolci <span id="dolci-tab-count" style="background:rgba(0,0,0,.12);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:2px;display:none">0</span></button>
    <button class="tab-bar-btn"        id="tab-tavo"  onclick="showTab('tavoli')">Conti</button>
    <button class="tab-bar-btn"        id="tab-menu"  onclick="showTab('menu')">Menu</button>
  </div>
</nav>

<!-- ══════════════ SALA ══════════════ -->
<div id="screen-cameriere" class="screen visible">
  <div class="cam-tavolo-bar">
    <select id="sel-tavolo" onchange="onTavoloSelect()">
      <option value="">— Seleziona tavolo —</option>
    </select>
    <div class="coperti-wrap hidden" id="coperti-wrap">
      <button class="coperti-btn" onclick="changeCoperti(-1)">−</button>
      <span class="coperti-val" id="coperti-val">2</span>
      <button class="coperti-btn" onclick="changeCoperti(1)">+</button>
      <span class="coperti-label">cop.</span>
    </div>
  </div>
  <div class="cam-level" id="cam-level-1">
    <div class="cat-grid" id="cat-grid"></div>
  </div>
  <div class="cam-level hidden" id="cam-level-2">
    <div class="cam-piatti-header">
      <button class="back-btn" onclick="goBackToCategories()">←</button>
      <span class="cam-piatti-title" id="cam-piatti-title"></span>
    </div>
    <div class="cam-piatti-list" id="cam-piatti-list"></div>
  </div>

  <!-- LIVELLO 3: piatto personalizzato -->
  <div class="cam-level hidden" id="cam-level-3">
    <div class="cam-piatti-header">
      <button class="back-btn" onclick="goBackToCategories()">←</button>
      <span class="cam-piatti-title">Piatto personalizzato</span>
    </div>
    <!-- step A: scegli categoria -->
    <div id="custom-step-cat" style="display:flex;flex-direction:column;gap:12px;padding:12px;padding-bottom:90px;flex:1">
      <div class="cat-box" style="flex:1;background:#2c2c29;border-color:#38362f" onclick="openCustomForm('Antipasti')">
        <span class="cat-box-emoji">🥗</span>
        <span class="cat-box-name" style="color:#f0ede8">Antipasto</span>
      </div>
      <div class="cat-box" style="flex:1;background:#2c2c29;border-color:#38362f" onclick="openCustomForm('Primi')">
        <span class="cat-box-emoji">🍝</span>
        <span class="cat-box-name" style="color:#f0ede8">Primo</span>
      </div>
      <div class="cat-box" style="flex:1;background:#2c2c29;border-color:#38362f" onclick="openCustomForm('Secondi')">
        <span class="cat-box-emoji">🥩</span>
        <span class="cat-box-name" style="color:#f0ede8">Secondo</span>
      </div>
      <div class="cat-box" style="flex:1;background:#2c2c29;border-color:#38362f" onclick="openCustomForm('Contorni')">
        <span class="cat-box-emoji">🥦</span>
        <span class="cat-box-name" style="color:#f0ede8">Contorno</span>
      </div>
    </div>
    <!-- step A2: sotto-categoria (non usato ma mantenuto per compatibilità) -->
    <div id="custom-step-subcat" style="display:none;flex-direction:column;gap:12px;padding:12px;flex:1">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <button class="back-btn" onclick="backToCustomCat()">←</button>
        <span style="font-size:17px;font-weight:700;color:#f0ede8" id="custom-subcat-label"></span>
      </div>
      <div id="custom-subcat-btns" style="display:flex;flex-direction:column;gap:12px;flex:1"></div>
    </div>
    <!-- step B: scrivi il piatto -->
    <div id="custom-step-form" class="custom-form" style="display:none;overflow-y:auto;flex:1">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <button class="back-btn" onclick="backToCustomCat()">←</button>
        <span style="font-size:18px;font-weight:700;color:#f0ede8" id="custom-form-cat-label"></span>
      </div>
      <label class="custom-form-label">Descrivi il piatto</label>
      <textarea class="custom-form-input" id="custom-piatto-text" rows="4" placeholder="Es. Tagliata senza sale con rucola..."></textarea>
      <label class="custom-form-label" style="margin-top:14px">Prezzo (opzionale)</label>
      <input type="number" min="0" step="0.5" id="custom-piatto-price" class="custom-form-input" style="height:44px;resize:none" placeholder="€ —" />
      <button class="custom-add-btn" id="custom-add-btn" onclick="addCustomPiatto()" disabled>+ Aggiungi alla comanda</button>
    </div>
  </div>
  <button class="cart-fab hidden" id="cart-fab" onclick="openCart()">
    Comanda <span class="cart-count" id="cart-count">0</span>
  </button>
  <div class="cart-overlay" id="cart-overlay" role="dialog" aria-modal="true">
    <div class="cart-header">
      <h2>Comanda</h2>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-body" id="cart-body"><div class="cart-empty">Nessun piatto aggiunto</div></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Totale</span><span id="cart-total">€0.00</span></div>
      <textarea class="cart-note" id="order-note" rows="2" placeholder="Note per la cucina..."></textarea>
      <button class="send-btn" id="send-btn" onclick="sendComanda()" disabled>Invia comanda</button>
    </div>
  </div>
</div>

<!-- ══════════════ CUCINA ══════════════ -->
<div id="screen-cucina" class="screen">
  <div class="cucina-kanban" id="cucina-grid"></div>
  <button class="cancellate-fab" onclick="openComandeCancellate()">🗑 Cancellate</button>
  <div class="cancellate-panel" id="cancellate-panel">
    <div class="cancellate-bar">
      <button class="back-btn" onclick="closeComandeCancellate()">←</button>
      <span class="cancellate-title">Comande Cancellate</span>
    </div>
    <div class="cancellate-list" id="cancellate-list"></div>
  </div>
</div>

<!-- ══════════════ DOLCI ══════════════ -->
<div id="screen-dolci" class="screen">
  <div class="cucina-kanban" id="dolci-grid"></div>
</div>
<!-- ══════════════ TAVOLI ══════════════ -->
<div id="screen-tavoli" class="screen">
  <div id="tav-level-1">
    <div class="tav-btn-grid" id="tavoli-grid">
      <div class="tavolo-empty">Nessun tavolo attivo</div>
    </div>
  </div>
  <div id="tav-level-2">
    <div class="tav-detail-bar">
      <button class="back-btn" onclick="backToTavoliGrid()">←</button>
      <span class="tav-detail-title" id="tav-detail-title"></span>
    </div>
    <div class="tav-detail-body" id="tav-detail-body"></div>
  </div>
</div>

<!-- ══════════════ MENU ══════════════ -->
<div id="screen-menu" class="screen">
  <div style="overflow-y:auto;flex:1">
    <div class="menu-manager-wrap">
      <div class="section-label">Aggiungi piatto</div>
      <div class="add-dish-form">
        <div class="form-row">
          <input class="form-input" id="dish-name" placeholder="Nome del piatto" oninput="checkAddDishBtn()" />
          <input class="form-input form-input-sm" id="dish-price" type="number" min="0" step="0.5" placeholder="€ prezzo" oninput="checkAddDishBtn()" />
        </div>
        <div class="form-row">
          <select class="form-select" id="dish-cat-sel" onchange="checkAddDishBtn()"></select>
        </div>
        <div id="add-dish-err" class="err-msg"></div>
        <button class="add-dish-btn" id="add-dish-btn" onclick="addDish()" disabled>+ Aggiungi al menu</button>
      </div>
      <div id="dish-list"></div>
    </div>
  </div>
</div>

<!-- MODALE CONFERMA CANCELLAZIONE -->
<div class="modal-overlay" id="modal-cancella">
  <div class="modal-box">
    <div class="modal-title">Cancella comanda</div>
    <div class="modal-msg">Sei sicuro di voler cancellare questa comanda?</div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="chiudiModale()">Annulla</button>
